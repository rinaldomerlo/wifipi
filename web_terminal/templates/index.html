<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Subpath URL normalization: redirect /terminal to /terminal/ for proper relative asset resolution
        if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal - WiFiPi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #08090f;
            --bg-light: #16192a;
            --glass-bg: rgba(22, 27, 49, 0.45);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #f5f6fa;
            --text-secondary: #8e95a5;
            --text-muted: #575e6d;
            --color-pink: #ff3b74;
            --color-blue: #00d2ff;
            --color-purple: #ab47bc;
            --color-green: #00e676;
            --color-orange: #ff9100;
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 15px rgba(0, 210, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 1.5rem;
        }

        .glass-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(171, 71, 188, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                        linear-gradient(145deg, #07080d 0%, #111424 100%);
            z-index: -1;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            /* Fill the viewport so the terminal card can flex to the space left
               over below the header, rather than collapsing to nothing. */
            height: calc(100vh - 3rem);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            flex-wrap: wrap;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--color-blue), var(--color-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 210, 255, 0.3));
        }

        .logo-text h1 {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .logo-text h1 span {
            color: var(--color-blue);
            font-weight: 400;
        }

        .logo-text .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Hostname badge — identifies which machine is serving this GUI */
        .host-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: rgba(8, 9, 15, 0.4);
            border: 1px solid var(--glass-border);
            padding: 0.4rem 0.85rem;
            border-radius: 50px;
            white-space: nowrap;
        }

        .host-badge i { color: var(--color-blue); }
        .host-badge strong { color: var(--text-primary); font-weight: 600; }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--color-blue);
            color: #fff;
            transform: translateY(-2px);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            padding: 1.75rem;
        }

        /* The terminal card holds the ttyd iframe and must fill the remaining
           height, so it uses padding tight enough not to waste terminal rows. */
        .terminal-card {
            flex: 1;
            min-height: 0;
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #terminal-frame {
            flex: 1;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: var(--bg-dark);
            display: block;
        }

        /* Shown instead of the iframe when the ttyd backend isn't reachable. */
        .status-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
        }

        .status-panel.visible { display: flex; }

        .status-panel .status-icon {
            font-size: 3rem;
            color: var(--color-orange);
        }

        .status-panel h2 {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-panel p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 46rem;
            line-height: 1.6;
        }

        .status-panel code {
            display: inline-block;
            font-family: var(--font-heading);
            font-size: 0.82rem;
            color: var(--color-blue);
            background: rgba(8, 9, 15, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.35rem 0.7rem;
            margin-top: 0.25rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.3rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 210, 255, 0.15);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn:hover {
            border-color: var(--color-blue);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .app-container { height: calc(100vh - 2rem); }
            .app-header { padding: 1rem 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-terminal logo-icon"></i>
                <div class="logo-text">
                    <h1>Web <span>Terminal</span></h1>
                    <span class="subtitle">Shell Access &mdash; Unprivileged Session</span>
                </div>
                <span class="host-badge" title="Hostname of the machine serving this page">
                    <i class="fa-solid fa-microchip"></i> <strong>{{ hostname }}</strong>
                </span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
            </div>
        </header>

        <div class="glass-card terminal-card">
            <!-- Relative src, like every other asset URL in this project, so the
                 app keeps working under the /terminal/ nginx prefix. -->
            <iframe id="terminal-frame" src="tty/" title="Terminal session" style="display: none;"></iframe>

            <div id="status-panel" class="status-panel">
                <i class="fa-solid fa-circle-notch fa-spin status-icon" id="status-icon"></i>
                <h2 id="status-title">Checking terminal backend&hellip;</h2>
                <p id="status-detail">Contacting the ttyd service.</p>
                <button class="btn" id="retry-btn" onclick="checkBackend()" style="display: none;">
                    <i class="fa-solid fa-rotate-right"></i> Retry
                </button>
            </div>
        </div>
    </div>

    <script>
        const frame = document.getElementById('terminal-frame');
        const panel = document.getElementById('status-panel');
        const icon = document.getElementById('status-icon');
        const title = document.getElementById('status-title');
        const detail = document.getElementById('status-detail');
        const retryBtn = document.getElementById('retry-btn');

        function showPanel(iconClass, iconColor, titleText, detailHtml, showRetry) {
            frame.style.display = 'none';
            panel.classList.add('visible');
            icon.className = iconClass + ' status-icon';
            icon.style.color = iconColor;
            title.textContent = titleText;
            detail.innerHTML = detailHtml;
            retryBtn.style.display = showRetry ? 'inline-flex' : 'none';
        }

        function showTerminal() {
            panel.classList.remove('visible');
            frame.style.display = 'block';
        }

        // Check the backend before showing the iframe: a stopped ttyd would
        // otherwise render as a browser error page inside the card, which tells
        // the user nothing about what to fix.
        function checkBackend() {
            showPanel('fa-solid fa-circle-notch fa-spin', 'var(--color-blue)',
                      'Checking terminal backend…', 'Contacting the ttyd service.', false);

            fetch('api/status', { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    if (data.available) {
                        showTerminal();
                    } else {
                        showPanel(
                            'fa-solid fa-triangle-exclamation', 'var(--color-orange)',
                            'Terminal service not running',
                            (data.reason || 'The ttyd backend is unreachable.') +
                            '<br><br>Check it with:<br><code>sudo systemctl status ttyd</code>' +
                            '<br><br>On a macOS development machine this is expected &mdash; ttyd is a Linux daemon.',
                            true
                        );
                    }
                })
                .catch(() => {
                    showPanel(
                        'fa-solid fa-plug-circle-xmark', 'var(--color-pink)',
                        'Cannot reach this app',
                        'The status endpoint did not respond. Check that the web-terminal service is running.',
                        true
                    );
                });
        }

        checkBackend();
    </script>
</body>
</html>
