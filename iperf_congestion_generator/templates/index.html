<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Subpath URL normalization: redirect /iperf to /iperf/ for proper relative asset resolution
        if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPERF3 - Network Congestion Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #08090f;
            --bg-light: #16192a;
            --glass-bg: rgba(22, 27, 49, 0.45);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #f5f6fa;
            --text-secondary: #8e95a5;
            --text-muted: #575e6d;
            --color-pink: #ff3b74;
            --color-blue: #00d2ff;
            --color-purple: #ab47bc;
            --color-green: #00e676;
            --color-orange: #ff9100;
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 15px rgba(0, 210, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 1.5rem;
        }

        .glass-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(171, 71, 188, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                        linear-gradient(145deg, #07080d 0%, #111424 100%);
            z-index: -1;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--color-blue), var(--color-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 210, 255, 0.3));
        }

        .logo-text h1 {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .logo-text h1 span {
            color: var(--color-blue);
            font-weight: 400;
        }

        .logo-text .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Hostname badge — identifies which machine is serving this GUI */
        .host-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: rgba(8, 9, 15, 0.4);
            border: 1px solid var(--glass-border);
            padding: 0.4rem 0.85rem;
            border-radius: 50px;
            white-space: nowrap;
        }

        .host-badge i {
            color: var(--color-blue);
        }

        .host-badge strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--color-blue);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Tab strip for concurrent tests. Rules mirror the Spectrum/Utilization
           tabs in wifi_utilization_monitor so both screens look the same, with
           the addition of a status dot and per-tab stop/close controls. */
        .tabs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tabs-titles {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-title {
            background: none;
            border: none;
            outline: none;
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.85rem 0.25rem;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .tab-title:hover { color: var(--text-primary); }
        .tab-title.active { color: var(--color-blue); }

        .tab-title.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--color-blue), var(--color-purple));
            border-radius: 3px 3px 0 0;
        }

        .tab-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .tab-dot.running {
            background: var(--color-green);
            box-shadow: 0 0 8px var(--color-green);
        }

        .tab-dot.error { background: var(--color-pink); }

        .tab-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 0.15rem;
            font-size: 0.8rem;
            transition: color 0.2s ease;
        }

        .tab-close:hover { color: var(--color-pink); }

        .tabs-empty {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 0.85rem 0;
        }

        .btn-ghost {
            background: none;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 0.78rem;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--color-blue);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            padding: 1.75rem;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: var(--glass-border-hover);
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            margin-top: 1.2rem;
        }

        label:first-of-type {
            margin-top: 0;
        }

        label i {
            margin-right: 4px;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(8, 9, 15, 0.6);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            border-color: var(--color-blue);
            box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.15);
        }

        select option {
            background-color: var(--bg-light);
            color: var(--text-primary);
        }

        .row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .row input {
            flex: 1;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            border: none;
            outline: none;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.7rem 1.4rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #btn-scan {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            white-space: nowrap;
        }

        #btn-scan:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border-hover);
        }

        #btn-start {
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            color: #08090f;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
        }

        #btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
        }

        #btn-stop {
            background: linear-gradient(135deg, var(--color-pink) 0%, #d81b60 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 59, 116, 0.25);
        }

        #btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 59, 116, 0.4);
        }

        #status-msg {
            font-size: 0.85rem;
            color: var(--color-orange);
            margin-top: 0.75rem;
            min-height: 1.2em;
            font-weight: 500;
        }

        #output {
            background: rgba(8, 9, 15, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            height: 420px;
            overflow-y: auto;
            color: var(--color-green);
        }

        #scan-results {
            margin-top: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        #scan-results button {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--color-blue);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #scan-results button:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--color-blue);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(8, 9, 15, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-bolt fa-bounce logo-icon"></i>
                <div class="logo-text">
                    <h1>IPERF<span>3</span></h1>
                    <span class="subtitle">Network Congestion Generator</span>
                </div>
                <span class="host-badge" title="Hostname of the machine serving this page">
                    <i class="fa-solid fa-microchip"></i> <strong>{{ hostname }}</strong>
                </span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
            </div>
        </header>

        <div class="glass-card">
            <div class="row" style="align-items: flex-end; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 180px;">
                    <label for="server-ip" style="margin-top: 0;"><i class="fa-solid fa-server"></i> Server IP Address</label>
                    <input id="server-ip" type="text" placeholder="e.g. 192.168.1.100">
                </div>
                <div style="flex: 1; min-width: 100px; max-width: 140px;">
                    <label for="server-port" style="margin-top: 0;"><i class="fa-solid fa-network-wired"></i> Port</label>
                    <input id="server-port" type="number" min="1" max="65535" placeholder="e.g. 5201">
                </div>
                <div style="margin-bottom: 2px;">
                    <button id="btn-scan" class="btn" onclick="scanLAN()" title="Scan LAN for iperf3 servers on ports 5201-5210"><i class="fa-solid fa-radar"></i> Scan LAN</button>
                </div>
            </div>
            <div id="scan-results"></div>

            <label for="duration"><i class="fa-solid fa-clock"></i> Duration (minutes)</label>
            <input id="duration" type="number" value="60" min="1">

            <label for="interface"><i class="fa-solid fa-ethernet"></i> Bind Interface</label>
            <select id="interface">
                <option value="wlan0">wlan0</option>
                <option value="eth0">eth0</option>
            </select>

            <label for="bandwidth"><i class="fa-solid fa-gauge-high"></i> Target Bandwidth (Mbps) &mdash; leave blank for unlimited</label>
            <input id="bandwidth" type="number" placeholder="unlimited" min="1">

            <div class="actions">
                <button id="btn-start" class="btn" onclick="startTest()"><i class="fa-solid fa-play"></i> Start Test</button>
                <button id="btn-stop" class="btn" onclick="stopTest()" disabled><i class="fa-solid fa-stop"></i> Stop All</button>
            </div>
            <div id="status-msg"></div>
        </div>

        <div class="glass-card">
            <!-- One tab per test. Several tests can run at once, so the output
                 pane shows whichever is selected rather than a single stream. -->
            <div class="tabs-header">
                <div class="tabs-titles" id="test-tabs">
                    <span class="tabs-empty">No tests yet</span>
                </div>
                <button class="btn-ghost" id="btn-clear-finished" onclick="clearFinished()" style="display:none;">
                    <i class="fa-solid fa-broom"></i> Clear finished
                </button>
            </div>
            <div id="output">Output will appear here once a test starts…</div>
        </div>
    </div>

    <script>
        let knownTests    = [];   // summaries from GET /tests
        let selectedId    = null; // which test's output the pane is showing
        let cursors       = {};   // test id -> next line index to fetch
        let maxConcurrent = 8;    // server-enforced cap, refreshed from /tests

        // Populates the Bind Interface dropdown from real interfaces on this host.
        // If detection is unavailable (off-Linux dev, no iproute2, or the request
        // simply fails) the static wlan0/eth0 options already in the markup are
        // left in place rather than cleared out.
        async function loadInterfaces() {
            const select = document.getElementById('interface');
            try {
                const res = await fetch('interfaces', { cache: 'no-store' });
                const data = await res.json();
                if (data.success && data.interfaces && data.interfaces.length) {
                    const previous = select.value;
                    select.innerHTML = data.interfaces.map((i) => `<option value="${i}">${i}</option>`).join('');
                    if (data.interfaces.includes(previous)) select.value = previous;
                }
            } catch (e) { /* keep the default options */ }
        }

        function setStatus(msg, color) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.style.color = color || 'var(--color-orange)';
        }

        function setRunning(anyRunning) {
            // Start stays available until the server's concurrency cap is hit --
            // running several tests at once is the point of this app.
            const running = knownTests.filter(t => t.status === 'running').length;
            document.getElementById('btn-start').disabled = running >= maxConcurrent;
            document.getElementById('btn-stop').disabled  = !anyRunning;
        }

        async function scanLAN() {
            const btn = document.getElementById('btn-scan');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Scanning…';
            const iface = document.getElementById('interface').value || 'wlan0';
            setStatus(`Scanning LAN on ${iface} for iperf3 servers (ports 5201-5210)…`, 'var(--color-blue)');
            document.getElementById('scan-results').innerHTML = '';

            try {
                const res = await fetch('scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bind_interface: iface })
                });
                const data = await res.json();
                if (data.error) {
                    setStatus('Scan error: ' + data.error, 'var(--color-pink)');
                } else if (!data.servers || data.servers.length === 0) {
                    setStatus(`No iperf3 servers found on ${iface}.`);
                } else {
                    setStatus(`Found ${data.servers.length} server target(s) on ${iface}. Click one to select it.`, 'var(--color-green)');
                    const div = document.getElementById('scan-results');
                    data.servers.forEach(item => {
                        const ip = typeof item === 'object' ? item.ip : item;
                        const port = typeof item === 'object' ? item.port : 5201;
                        const b = document.createElement('button');
                        b.innerHTML = `<i class="fa-solid fa-server"></i> ${ip}:${port}`;
                        b.onclick = () => {
                            document.getElementById('server-ip').value = ip;
                            document.getElementById('server-port').value = port;
                            setStatus(`Selected target: ${ip}:${port}`, 'var(--color-green)');
                        };
                        div.appendChild(b);
                    });
                }
            } catch (e) {
                setStatus('Scan failed: ' + e, 'var(--color-pink)');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-radar"></i> Scan LAN';
            }
        }

        async function startTest() {
            let serverIp   = document.getElementById('server-ip').value.trim();
            let serverPort = parseInt(document.getElementById('server-port').value) || 5201;
            const duration   = parseInt(document.getElementById('duration').value) || 60;
            const iface      = document.getElementById('interface').value;
            const bandwidth  = document.getElementById('bandwidth').value.trim();

            if (!serverIp) { setStatus('Please enter a server IP address.', 'var(--color-pink)'); return; }

            if (serverIp.includes(':')) {
                const parts = serverIp.split(':');
                serverIp = parts[0];
                serverPort = parseInt(parts[1]) || serverPort;
            }

            setStatus(`Starting test against ${serverIp}:${serverPort}…`, 'var(--color-blue)');

            try {
                const res = await fetch('start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        server_ip: serverIp,
                        server_port: serverPort,
                        duration_minutes: duration,
                        bind_interface: iface,
                        bandwidth_mbps: bandwidth
                    })
                });
                const data = await res.json();
                if (data.error) {
                    setStatus('Error: ' + data.error, 'var(--color-pink)');
                    return;
                }
                // Focus the tab for the test just started, resetting the pane so
                // its output doesn't append below the previously viewed test's.
                selectedId = data.test_id;
                cursors[selectedId] = 0;
                document.getElementById('output').textContent = '';
            } catch (e) {
                setStatus('Failed to start: ' + e, 'var(--color-pink)');
                return;
            }

            setStatus(`Test running against ${serverIp}:${serverPort}…`, 'var(--color-green)');
            await refreshTests();
        }

        // ---- Tabs and output -------------------------------------------------
        //
        // Tests run in the server process, not in this page, so the page holds no
        // authoritative state: it rebuilds the tab strip from GET /tests and pulls
        // output from a per-test ring buffer using a cursor. That is what makes a
        // reload reattach to whatever is already running, and it means several
        // tabs can watch the same test without stealing each other's output.

        function tabLabel(t) {
            return `#${t.id.replace(/^t/, '')} :${t.server_port}`;
        }

        function renderTabs() {
            const strip = document.getElementById('test-tabs');
            const clearBtn = document.getElementById('btn-clear-finished');

            // The empty state is rendered as part of this string rather than kept
            // as a separate element: writing innerHTML below would destroy such an
            // element, and the next call would then throw on a null reference and
            // silently stop updating the strip.
            if (!knownTests.length) {
                strip.innerHTML = '<span class="tabs-empty">No tests yet</span>';
                clearBtn.style.display = 'none';
                return;
            }

            strip.innerHTML = knownTests.map(t => {
                const dot = t.status === 'running' ? 'running' : (t.status === 'error' ? 'error' : '');
                const active = t.id === selectedId ? ' active' : '';
                const close = t.status === 'running'
                    ? `<span class="tab-close" title="Stop this test" onclick="event.stopPropagation(); stopOne('${t.id}')"><i class="fa-solid fa-stop"></i></span>`
                    : `<span class="tab-close" title="Remove this test" onclick="event.stopPropagation(); forgetOne('${t.id}')"><i class="fa-solid fa-xmark"></i></span>`;
                return `<button class="tab-title${active}" onclick="selectTest('${t.id}')"
                            title="${t.server_ip}:${t.server_port} via ${t.bind_interface} — ${t.status}">
                            <span class="tab-dot ${dot}"></span>${tabLabel(t)}${close}
                        </button>`;
            }).join('');

            clearBtn.style.display =
                knownTests.some(t => t.status !== 'running') ? '' : 'none';
        }

        function selectTest(id) {
            if (selectedId === id) return;
            // Keep where the user was scrolled to in the tab they are leaving.
            const out = document.getElementById('output');
            selectedId = id;
            cursors[id] = 0;          // replay this test's buffer from the start
            out.textContent = '';
            renderTabs();
            pollOutput();
        }

        async function refreshTests() {
            try {
                const res = await fetch('tests', { cache: 'no-store' });
                const data = await res.json();
                knownTests = data.tests || [];
                if (data.max_concurrent) maxConcurrent = data.max_concurrent;
            } catch (e) {
                return; // transient failure; keep showing what we have
            }

            if (!knownTests.some(t => t.id === selectedId)) {
                const running = knownTests.filter(t => t.status === 'running');
                const pick = running.length ? running[running.length - 1]
                                            : knownTests[knownTests.length - 1];
                selectedId = pick ? pick.id : null;
                document.getElementById('output').textContent = '';
                if (selectedId) cursors[selectedId] = 0;
            }

            setRunning(knownTests.some(t => t.status === 'running'));
            renderTabs();
        }

        async function pollOutput() {
            if (!selectedId) return;
            const id = selectedId;
            const since = cursors[id] || 0;

            let data;
            try {
                const res = await fetch(`tests/${id}/output?since=${since}`, { cache: 'no-store' });
                if (res.status === 404) { await refreshTests(); return; }
                data = await res.json();
            } catch (e) {
                return; // transient failure; try again on the next tick
            }
            if (id !== selectedId) return;  // user switched tabs mid-request

            const out = document.getElementById('output');
            let text = '';
            if (data.dropped) {
                text += `… ${data.dropped} earlier line(s) dropped from the buffer …\n`;
            }
            if (data.lines.length) text += data.lines.join('\n') + '\n';

            if (text) {
                const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
                out.textContent += text;
                // Only auto-scroll if the user was already at the bottom, so
                // scrolling back through history isn't yanked away each tick.
                if (atBottom) out.scrollTop = out.scrollHeight;
            }
            cursors[id] = data.next;
        }

        async function stopOne(id) {
            await fetch(`tests/${id}/stop`, { method: 'POST' });
            setStatus('Stopping test…', 'var(--color-orange)');
            await refreshTests();
        }

        async function forgetOne(id) {
            await fetch(`tests/${id}`, { method: 'DELETE' });
            if (id === selectedId) selectedId = null;
            delete cursors[id];
            await refreshTests();
        }

        async function clearFinished() {
            const finished = knownTests.filter(t => t.status !== 'running');
            for (const t of finished) {
                await fetch(`tests/${t.id}`, { method: 'DELETE' });
                delete cursors[t.id];
                if (t.id === selectedId) selectedId = null;
            }
            await refreshTests();
        }

        async function stopTest() {
            await fetch('stop', { method: 'POST' });
            setStatus('Stopping all tests…', 'var(--color-orange)');
            await refreshTests();
        }

        // Rebuild from the server on load: this is the reattach.
        loadInterfaces();
        refreshTests().then(pollOutput);
        setInterval(refreshTests, 3000);
        setInterval(pollOutput, 1000);
    </script>
</body>
</html>
