# Client Simulator (client_simulator, port 5005).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/clientsim.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /clientsim {
    return 301 /clientsim/;
}

location /clientsim/ {
    proxy_pass http://127.0.0.1:5005/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time Server-Sent Events (SSE) client-activity streaming
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
