# iPerf3 Congestion Generator (iperf_congestion_generator, port 5001).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/iperf.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /iperf {
    return 301 /iperf/;
}

location /iperf/ {
    proxy_pass http://127.0.0.1:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time Server-Sent Events (SSE) iperf3 output streaming
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
