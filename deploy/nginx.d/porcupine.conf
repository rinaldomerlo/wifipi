# WiFi Porcupine (wifi_porcupine, port 5010).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/porcupine.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /porcupine {
    return 301 /porcupine/;
}

location /porcupine/ {
    proxy_pass http://127.0.0.1:5010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
