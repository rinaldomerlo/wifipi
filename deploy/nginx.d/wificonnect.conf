# WiFi Connection Manager (wifi_connection_manager, port 5003).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/wificonnect.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /wificonnect {
    return 301 /wificonnect/;
}

location /wificonnect/ {
    proxy_pass http://127.0.0.1:5003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
