# Video Stream Simulator (video_stream_simulator, port 5012).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/videostream.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.
#
# Note: the /videostream/content/ alias serves the app's generated HLS ladder
# directly (bypassing Python). The nginx worker user (commonly www-data) needs
# read access to /opt/wifipi/video_stream_simulator/content/. Unlike the
# browsing simulator's corpus this is not merely a nice-to-have: several
# concurrent 1080p viewers pulling 4-second segments will saturate Flask's
# worker threads long before they saturate the WiFi link, which would measure
# the wrong thing entirely.

location = /videostream {
    return 301 /videostream/;
}

# Generated HLS ladder served directly as static files; nginx picks the longest
# matching prefix so this wins over /videostream/ regardless of declaration order.
location /videostream/content/ {
    alias /opt/wifipi/video_stream_simulator/content/;

    # Segments are immutable once generated, but a proxy or browser caching them
    # would mean later fetches never touch the network -- exactly what this app
    # exists to exercise. The client discards bodies and never re-requests through
    # a cache, so this is belt-and-braces for anyone pointing a real player at it.
    add_header Cache-Control "no-store";

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
    }
}

location /videostream/ {
    proxy_pass http://127.0.0.1:5012/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time Server-Sent Events (SSE) segment output streaming
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
