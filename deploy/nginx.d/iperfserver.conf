# iPerf3 Server Manager (iperf_server_manager, port 5002).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/iperfserver.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /iperfserver {
    return 301 /iperfserver/;
}

location /iperfserver/ {
    proxy_pass http://127.0.0.1:5002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
