# Web Browsing Simulator (web_browsing_simulator, port 5004).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/webbrowse.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.
#
# Note: the /webbrowse/content/ alias serves the app's generated corpus directly
# (bypassing Python). The nginx worker user (commonly www-data) needs read access
# to /opt/wifipi/web_browsing_simulator/content/.

location = /webbrowse {
    return 301 /webbrowse/;
}

# Generated content served directly as static files; nginx picks the longest
# matching prefix so this wins over /webbrowse/ regardless of declaration order.
location /webbrowse/content/ {
    alias /opt/wifipi/web_browsing_simulator/content/;
}

location /webbrowse/ {
    proxy_pass http://127.0.0.1:5004/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time Server-Sent Events (SSE) page-load output streaming
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
