# WiFi Roaming Monitor (roaming_monitor, port 5007).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/roaming.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /roaming {
    return 301 /roaming/;
}

location /roaming/ {
    proxy_pass http://127.0.0.1:5007/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time Server-Sent Events (SSE) association-event streaming
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
