# WiFi Channel & Utilization Monitor (wifi_utilization_monitor, port 5000).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/wifimon.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.

location = /wifimon {
    return 301 /wifimon/;
}

location /wifimon/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
