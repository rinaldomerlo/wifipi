# Web Terminal (web_terminal, port 5008) + ttyd backend (loopback port 5009).
# Per-app nginx snippet: install only on Pis running this app.
#   sudo cp deploy/nginx.d/terminal.conf /etc/nginx/wifipi.d/
# Included into the server{} block by deploy/nginx.conf.example.
#
# DEPENDENCY: the /terminal/tty/ block below uses the $connection_upgrade map,
# which lives in http{} context, not here. If you install this snippet you MUST
# also install the map, or `nginx -t` fails with:
#   unknown "connection_upgrade" variable
#   sudo cp deploy/nginx-websocket-map.conf.example /etc/nginx/conf.d/websocket-upgrade.conf
# The terminal is also two systemd units (web-terminal.service + ttyd.service).

location = /terminal {
    return 301 /terminal/;
}

# Web Terminal wrapper (/terminal/) -- WiFiPi header, hostname badge and the
# iframe that hosts the terminal. Plain proxy, no WebSocket here.
location /terminal/ {
    proxy_pass http://127.0.0.1:5008/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ttyd backend (/terminal/tty/). Nginx picks the longest matching prefix, so
# this wins over /terminal/ above.
location /terminal/tty/ {
    # No URI part on proxy_pass: the path is passed through unmodified so it
    # matches ttyd's --base-path, rather than being rewritten to /.
    proxy_pass http://127.0.0.1:5009;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;

    # A terminal can sit idle far longer than the 60s default before the user
    # types again; without this nginx silently drops the session.
    proxy_read_timeout 86400;
    proxy_buffering off;

    # The wrapper page frames ttyd on the same origin.
    proxy_hide_header X-Frame-Options;
}
